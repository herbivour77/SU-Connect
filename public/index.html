<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SU Connect</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand">SU Connect<small>Scripture Union Singapore</small></div>
      <div class="nav-item" data-view="dashboard">Dashboard</div>
      <div class="nav-item" data-view="contacts">Contacts</div>
      <div class="nav-item" data-view="donations">Donations</div>
      <div class="nav-item" data-view="volunteers">Volunteers</div>

      <div class="nav-section-label" id="adminSectionLabel" style="display:none;">Admin Panel</div>
      <div class="nav-item" data-view="users" id="navUsers" style="display:none;">User Management</div>
      <div class="nav-item" data-view="roles" id="navRoles" style="display:none;">Roles &amp; Permissions</div>
      <div class="nav-item" data-view="audit" id="navAudit" style="display:none;">Admin History</div>
      <div class="nav-item" data-view="security" id="navSecurity" style="display:none;">Security &amp; Access Logs</div>
      <div class="nav-item" data-view="importHistory" id="navImportHistory" style="display:none;">Import History</div>
      <div class="nav-item" data-view="exportHistory" id="navExportHistory" style="display:none;">Export History</div>
      <div class="nav-item" data-view="systemActivity" id="navSystemActivity" style="display:none;">System Activity</div>

      <div class="nav-item" data-view="logout" style="margin-top: 30px; opacity: 0.8;">Log Out</div>
    </nav>
    <main class="main" id="main">
      <div class="main-header">
        <h2 id="viewTitle">Loading…</h2>
        <div class="who" id="whoAmI"></div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <!-- SheetJS: used client-side only, to read an uploaded .xlsx into rows
       before they're posted to contacts-import as plain JSON. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
