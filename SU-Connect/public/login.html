<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SU Connect — Login</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="centered-page">
    <div class="card">
      <h1>SU Connect</h1>
      <div class="subtitle">Scripture Union Singapore — CRM</div>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required autofocus />

        <label>Password</label>
        <input type="password" id="password" required />

        <button class="primary" type="submit">Sign In</button>
      </form>
      <div class="error-text" id="errorText" style="display:none;"></div>
      <div class="hint-text">First time setting up SU Connect? <a href="/setup.html">Run setup</a></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorText = document.getElementById('errorText');
      errorText.style.display = 'none';
      try {
        await Api.post('auth-login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        window.location.href = '/index.html';
      } catch (err) {
        errorText.textContent = err.message;
        errorText.style.display = 'block';
      }
    });
  </script>
</body>
</html>
