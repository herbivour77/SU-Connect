<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SU Connect — First-Time Setup</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="centered-page">
    <div class="card">
      <h1>SU Connect</h1>
      <div class="subtitle">First-time setup — create the initial Super Admin</div>
      <form id="setupForm">
        <label>Setup Token</label>
        <input type="password" id="setupToken" required placeholder="From SEED_TOKEN env var" />

        <label>Full Name</label>
        <input type="text" id="fullName" required value="Basil" />

        <label>Email</label>
        <input type="email" id="email" required placeholder="basil@su.org.sg" />

        <label>Password</label>
        <input type="password" id="password" required />

        <button class="primary" type="submit">Create Super Admin</button>
      </form>
      <div class="error-text" id="errorText" style="display:none;"></div>
      <div class="hint-text" id="successText" style="display:none;"></div>
      <div class="hint-text">
        This page only works once. As soon as one user exists in the system,
        the setup endpoint permanently refuses to run again.
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorText = document.getElementById('errorText');
      const successText = document.getElementById('successText');
      errorText.style.display = 'none';
      successText.style.display = 'none';

      try {
        await Api.post('seed', {
          setupToken: document.getElementById('setupToken').value,
          fullName: document.getElementById('fullName').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        successText.textContent = 'Super Admin created. Redirecting to login…';
        successText.style.display = 'block';
        setTimeout(() => (window.location.href = '/login.html'), 1200);
      } catch (err) {
        errorText.textContent = err.message;
        errorText.style.display = 'block';
      }
    });
  </script>
</body>
</html>
